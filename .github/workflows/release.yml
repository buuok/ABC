name: 发布安装包
on:
  push:
    branches: [release-assets]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 创建 Release 并上传安装包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.3.0 assets/*.zip \
            --repo "$GITHUB_REPOSITORY" --target main \
            --title "声音统一 v0.3.0" \
            --notes "双击即用的独立版，不需要安装任何软件。

          - Windows 10/11（64 位）：下载 VoiceUnify-Windows.zip，解压后双击 VoiceUnify.exe
          - Mac 苹果芯片：下载 VoiceUnify-Mac-AppleSilicon.zip
          - Mac Intel：下载 VoiceUnify-Mac-Intel.zip
          Mac 解压后首次在“声音统一.command”上右键 → 打开。

          详细说明见压缩包里的“使用说明.txt”。"
